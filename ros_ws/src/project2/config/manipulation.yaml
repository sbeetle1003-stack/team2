pick_place_controller:
  ros__parameters:
    use_sim_time: true
    base_frame: link1
    tool_frame: end_effector_link

    # Board center and row-major 3x3 spacing in the robot base frame.
    board_origin_x: 0.30
    board_origin_y: 0.0
    cell_spacing: 0.08

    # Five robot pieces are arranged from left to right at the supply line.
    supply_x: 0.10
    supply_y: -0.20
    supply_spacing: 0.05
    piece_count: 5

    # Tune these heights after checking the real gripper/tool offset.
    pre_grasp_z: 0.15
    grasp_z: 0.075
    lift_z: 0.15
    pre_place_z: 0.15
    place_z: 0.075
    retreat_z: 0.15

    # OpenManipulator-X tutorial-compatible default orientation.
    orientation_x: 0.0
    orientation_y: 0.0
    orientation_z: 0.0
    orientation_w: 1.0

    # Vision-based board frame (coordinate estimation). When enabled, each
    # placement looks up board_frame (see board_frame_publisher) instead of
    # using board_origin_x/y above; falls back to the fixed origin if the
    # marker has not been seen within board_frame_max_age_sec.
    use_vision_board_frame: false
    board_frame_id: board_frame
    camera_optical_frame: camera_optical
    board_frame_max_age_sec: 2.0

    return_home: true
    add_table_collision: false
    # Gazebo-only workaround for unsupported gripper mimic constraints.
    # Set false when controlling the real OpenManipulator-X.
    simulate_piece_attachment: true
    piece_rest_z: 0.025
    dry_run: false
