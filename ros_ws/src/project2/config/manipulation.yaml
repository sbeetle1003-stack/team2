pick_place_controller:
  ros__parameters:
    use_sim_time: false
    base_frame: link1
    tool_frame: end_effector_link

    # Board center and row-major 3x3 spacing in the robot base frame.
    board_origin_x: 0.30
    board_origin_y: 0.0
    cell_spacing: 0.05

    # Five robot pieces are arranged from left to right at the supply line.
    supply_x: 0.10
    supply_y: -0.20
    supply_spacing: 0.05
    piece_count: 5

    # Tune these heights after checking the real gripper/tool offset.
    pre_grasp_z: 0.15
    grasp_z: 0.075
    lift_z: 0.13
    pre_place_offset_z: 0.10
    retreat_offset_z: 0.10

    # 좌표 보정값 추가
    place_target_offset_x: -0.03
    place_target_offset_y: 0.0
    place_offset_z: 0.01

    # OpenManipulator-X tutorial-compatible default orientation.
    orientation_x: 0.0
    orientation_y: 0.0
    orientation_z: 0.0
    orientation_w: 1.0

    return_home: true
    add_table_collision: false
    # Gazebo-only workaround for unsupported gripper mimic constraints.
    # Set false when controlling the real OpenManipulator-X.
    simulate_piece_attachment: true
    piece_rest_z: 0.025
    dry_run: false
    