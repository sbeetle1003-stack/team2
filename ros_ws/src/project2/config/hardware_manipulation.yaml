pick_place_controller:
  ros__parameters:
    # Real OpenManipulator-X uses wall time and hardware ros2_control.
    use_sim_time: false
    robot_use_sim: false
    arm_controller: arm_controller
    gripper_controller: gripper_controller

    base_frame: link1
    tool_frame: end_effector_link

    # Camera-view cell coordinates at the OpenManipulator-X home pose.
    # Replace only this file after measuring the physical setup.
    board_origin_x: 0.30
    board_origin_y: 0.0
    cell_spacing: 0.08
    supply_x: 0.10
    supply_y: -0.20
    supply_spacing: 0.05
    piece_count: 5

    pre_grasp_z: 0.15
    grasp_z: 0.075
    lift_z: 0.15
    pre_place_z: 0.15
    place_z: 0.075
    retreat_z: 0.15

    orientation_x: 0.0
    orientation_y: 0.0
    orientation_z: 0.0
    orientation_w: 1.0

    return_home: true
    add_table_collision: false
    # Mirror the held/released Gazebo piece while the real robot executes.
    simulate_piece_attachment: true
    # Hardware mode: planned trajectories are sent to arm_controller and
    # gripper_controller. Set true only for a no-motion dry run.
    dry_run: false
