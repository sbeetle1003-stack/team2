pick_place_controller:
  ros__parameters:
    use_sim_time: false
    base_frame: link1
    tool_frame: end_effector_link

    # Board center and row-major 3x3 spacing in the robot base frame.
    # No physical board exists yet -- these are the same coordinates
    # verified reachable in Gazebo (manipulation.yaml), reused here purely
    # as a fixed test target in free space.
    board_origin_x: 0.30
    board_origin_y: 0.0
    cell_spacing: 0.08

    supply_x: 0.10
    supply_y: -0.20
    supply_spacing: 0.05
    piece_count: 5

    # Same heights as manipulation.yaml (base_frame link1, IK-verified in
    # Gazebo). CAUTION: there is no real desk/table modeled here, so these
    # z values are NOT verified clear of a real physical surface -- check
    # the actual desk height under the arm before running for real.
    pre_grasp_z: 0.15
    grasp_z: 0.075
    lift_z: 0.15
    pre_place_z: 0.10
    place_z: 0.075
    retreat_z: 0.10

    orientation_x: 0.0
    orientation_y: 0.0
    orientation_z: 0.0
    orientation_w: 1.0

    return_home: true
    add_table_collision: false
    # No Gazebo -- the real gripper does the actual holding, no
    # SetEntityPose/attach-detach simulation needed.
    simulate_piece_attachment: false
    piece_rest_z: 0.05
    supply_rest_z: 0.025
    dry_run: false
